[pytest]
# only collect tests from the dedicated tests/ directory and files beginning
# with "test_".  The core automation modules unfortunately also use the
# "*_test.py" naming convention (e.g. ``bat_test.py``) which would otherwise
# be treated as test modules and result in import errors when pytest adds their
# parent directory to sys.path.  Restricting the pattern avoids that problem.
testpaths = automation/tests
python_files = test_*.py
