<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Automation Fixture — Component Diagram</title>
<style>
  body { margin: 0; background: #1a1a2e; display: flex; flex-direction: column; align-items: center; font-family: Segoe UI, Arial, sans-serif; }
  h1 { color: #B0C4DE; font-size: 16px; margin: 14px 0 6px; letter-spacing: 1px; }
  .subtitle { color: #888; font-size: 12px; margin-bottom: 10px; }
  .diagram-wrap { background: white; border-radius: 12px; box-shadow: 0 4px 32px #0008; overflow: auto; margin-bottom: 20px; max-width: 98vw; }
  .diagram-wrap img, .diagram-wrap svg, .diagram-wrap object { display: block; }
  .controls { display: flex; gap: 10px; margin-bottom: 10px; }
  button { background: #2E75B6; color: white; border: none; padding: 7px 18px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button:hover { background: #1F3864; }
</style>
</head>
<body>
<h1>FULL AUTOMATION FIXTURE — HIGH-LEVEL COMPONENT DIAGRAM</h1>
<p class="subtitle">RH_i460 FCT | 4-Slot Parallel | India (FCT SW) + BANWA (PLC / Robot) | June 2026</p>
<div class="controls">
  <button onclick="document.querySelector('.diagram-wrap').style.transform='scale(1)'; zl=1">Reset Zoom</button>
  <button onclick="zl=Math.min(zl+0.15,3); document.querySelector('.diagram-wrap object').style.width=(1700*zl)+'px'">Zoom In</button>
  <button onclick="zl=Math.max(zl-0.15,0.3); document.querySelector('.diagram-wrap object').style.width=(1700*zl)+'px'">Zoom Out</button>
  <button onclick="window.print()">Print / Save PDF</button>
</div>
<div class="diagram-wrap">
  <object type="image/svg+xml" data="Full_Automation_Component_Diagram.svg"
          width="1700" style="min-width:900px">
    <img src="Full_Automation_Component_Diagram.svg" width="1700" alt="Component Diagram"/>
  </object>
</div>
<script>var zl=1;</script>
</body>
</html>
